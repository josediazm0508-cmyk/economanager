<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Economaganer | Login</title>
    <link rel="stylesheet" href="../styles/login.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>

<body>

    <div class="principal">
        <div class="containerDiv">
            <img src="../images/logo.png" alt="">
            <div id="formularioPrincipal" class="modo-login">
                <label>Usuario</label>
                <input type="text" autocomplete="off" autocorrect="off" id="inputUser">
                <label>Contraseña</label>
                <input type="password" autocomplete="off" autocorrect="off" id="inputPassword">

                <button class="btnSubmitForm">Aceptar</button>

                <p class="toRegister">¿Eres nuevo? <span class="btn-cambio">Regístrate</span></p>
                <p class="toLogin">¿Ya tienes cuenta? <span class="btn-cambio">Inicia sesión</span></p>
            </div>

        </div>
    </div>

    <script src="../logic/login.js"></script>
</body>

</html>
